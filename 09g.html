<!DOCTYPE html>
<html>
  <head>
    <title>DOM projects</title>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
      subscribe()
    " class="js-subscribe-button">Subscribe</button>
      
    <p>Rock Paper Scissors</p>
    <a href="http://127.0.0.1:5500/09-rock-paper-scissors.html">Click here</a>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input class="js-cost-input" type="text" placeholder="Cost of order" onkeydown="
      handleCostKeydown(event);
    ">
    <button onclick="
      calculateTotal();
    ">Claculate</button>
    <p class="js-final-cost"></p>

    <script>
      function handleCostKeydown(event) {
        if (event.key === 'Enter') {
          calculateTotal();
        }
      }

      function calculateTotal() {
        const orderCost = Number(document.querySelector('.js-cost-input').value)
        if (Number(orderCost) >= 40) {
          document.querySelector('.js-final-cost').innerHTML = `$${orderCost.toFixed(2)}`;
        }
        else if(orderCost < 40) {
          document.querySelector('.js-final-cost').innerHTML = `$${(orderCost + 10).toFixed(2)}`;
        }
      };
      function subscribe(){
        const buttonElement = document.querySelector('.js-subscribe-button');
        if(buttonElement.innerText ==='Subscribe'){
          buttonElement.innerText = 'Subscribed';
        }
        else{
          buttonElement.innerText = 'Subscribe';
        }
      }
    </script>
  </body>
</html>
